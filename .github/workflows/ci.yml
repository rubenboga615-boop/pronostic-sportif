name: CI

# Deux garanties à chaque poussée : la suite de tests passe sur un clone neuf
# (sans base de production), et le dépôt reste à zéro violation de style.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Tests et style
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vérifier le style
        run: ruff check .

      - name: Vérifier le formatage
        run: ruff format --check .

      - name: Exécuter la suite de tests
        run: python -m pytest -q
