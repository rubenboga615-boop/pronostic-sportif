name: CI

# Deux garanties à chaque poussée : la suite de tests passe sur un clone neuf
# (sans base de production), et le dépôt reste à zéro violation de style.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Tests et style (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 est le minimum déclaré, 3.12 la version de référence. Vérifier
        # les deux évite de laisser filer une syntaxe qui fermerait la porte
        # aux environnements restés en 3.11.
        python: ["3.11", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,api]"

      - name: Vérifier le style
        run: ruff check .

      - name: Vérifier le formatage
        run: ruff format --check .

      - name: Exécuter la suite de tests
        run: python -m pytest -q
