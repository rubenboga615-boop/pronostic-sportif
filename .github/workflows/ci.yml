name: CI

# Deux garanties à chaque poussée : la suite de tests passe sur un clone neuf
# (sans base de production), et le dépôt reste à zéro violation de style.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Tests et style (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 est le minimum déclaré, 3.12 la version de référence. Vérifier
        # les deux évite de laisser filer une syntaxe qui fermerait la porte
        # aux environnements restés en 3.11.
        python: ["3.11", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,api]"

      - name: Vérifier le style
        run: ruff check .

      - name: Vérifier le formatage
        run: ruff format --check .

      - name: Exécuter la suite de tests
        run: python -m pytest -q

  noyau_seul:
    name: Suite verte sans les extras
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Le noyau — import, features, entraînement, prédiction, règlement,
    # backtest — doit tourner sans scikit-learn ni FastAPI. Le job « qualite »
    # installe les extras et ne peut donc pas le vérifier : c'est ainsi qu'une
    # suite verte en intégration continue s'est retrouvée à quatre échecs sur
    # une installation « dev » seule.
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le noyau et les outils de test uniquement
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vérifier qu'aucun extra ne s'est glissé dans l'installation
        run: |
          ! python -c "import sklearn" 2>/dev/null
          ! python -c "import fastapi" 2>/dev/null

      - name: Exécuter la suite de tests
        run: python -m pytest -q
