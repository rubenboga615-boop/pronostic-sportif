[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pronostic-sportif"
version = "0.1.0"
description = "Moteur probabiliste de pronostic football"
readme = "README.md"
license = {text = "MIT"}
# 3.11 est le minimum réel : le code emploie `datetime.UTC` et `tomllib`,
# apparus en 3.11, mais rien de propre à 3.12. Exiger 3.12 fermait la porte
# à des environnements parfaitement capables — un proot Ubuntu sur Android,
# par exemple. L'intégration continue vérifie les deux versions.
requires-python = ">=3.11"
# Noyau : tout ce qu'il faut pour importer, calculer les features, entraîner,
# prédire, régler et évaluer. Rien de plus.
#
# L'API, le tableau de bord et l'apprentissage automatique sont des extras.
# Les y laisser obligeait à installer FastAPI, Streamlit et scikit-learn pour
# lancer un simple import de CSV — un obstacle réel sur les plateformes sans
# roue précompilée, où chacune de ces bibliothèques doit être compilée.
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# Calibration des probabilités (Platt, isotonique) et modèles d'apprentissage
# automatique de la Phase 1. scikit-learn n'est importé qu'au moment de
# calibrer : le reste du projet fonctionne sans.
ml = [
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.4.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
dashboard = [
    "streamlit>=1.38.0",
]
scraping = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "aiohttp>=3.10.0",
]

[tool.setuptools.packages.find]
# Découverte explicite : la racine contient des répertoires qui ne sont pas des
# paquets installables (dashboard, migrations, scripts, tests, data), et
# setuptools refuse de trancher seul en disposition « à plat ».
include = ["app*", "collectors*", "evaluation*", "features*", "models*", "pipelines*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
